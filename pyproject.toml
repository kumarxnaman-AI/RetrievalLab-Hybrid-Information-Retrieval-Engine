[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "searchlab"
version = "0.1.0"
description = "Hybrid retrieval lab: from-scratch BM25, HNSW, fusion, reranking, API and dashboard"
requires-python = ">=3.10"
dependencies = ["numpy", "sentence-transformers", "matplotlib", "fastapi", "uvicorn", "streamlit", "requests"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
